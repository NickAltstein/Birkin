[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-receipts"
version = "1.0.0"
description = "Cryptographic authorization receipts, sub-2ms fail-closed PreToolUse hooks, and offline hash-chain verification for autonomous AI agents."
readme = "README.md"
authors = [
    { name = "Nick Altstein", email = "nickaltstein@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "pydantic>=2.5",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[project.scripts]
agent-receipts = "agent_receipts.cli:cli"
birkin = "agent_receipts.cli:cli"

[tool.setuptools.packages.find]
include = ["agent_receipts*", "birkin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
