[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receiptd"
version = "1.0.0"
description = "Cryptographic authorization receipts, 0.02ms in-process policy checks (~78ms cold CLI hook), and offline hash-chain verification for autonomous AI agents."
readme = "README.md"
authors = [
    { name = "Nick Altstein", email = "nickaltstein@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "pydantic>=2.5",
    "typer>=0.9",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[project.scripts]
receiptd = "receiptd.cli:cli"
birkin = "receiptd.cli:cli"

[tool.setuptools.packages.find]
include = ["receiptd*", "birkin*"]

[tool.setuptools.package-data]
"receiptd.card" = ["rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
